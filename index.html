<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expedición Salvaje</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-page">
  <div class="language-toggle">
    <button onclick="setLanguage('es')" class="lang-btn active">ES</button>
    <button onclick="setLanguage('en')" class="lang-btn">EN</button>
  </div>

  <div class="login-container">
    <div class="logo-container">
      <span class="logo-emoji">🐾</span>
      <h1 data-i18n="login.title">Expedición Salvaje</h1>
      <p data-i18n="login.subtitle">Ingresa tu código de expedición</p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <input
        type="text"
        id="code-input"
        class="input"
        placeholder="Tu código"
        data-i18n-placeholder="login.placeholder"
        autocomplete="off"
      >
      <button type="submit" class="btn-primary" data-i18n="login.button">
        🐾 Iniciar misión
      </button>
    </form>

    <div id="error-message" class="error-message hidden"></div>

    <a href="admin.html" class="admin-link" data-i18n="login.adminLink">Soy Admin</a>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    updateAllTexts();
  </script>
</body>
</html>

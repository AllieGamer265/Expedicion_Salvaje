<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Portal - Expedición Salvaje</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="student-page">
  <header class="student-header">
    <div class="header-content">
      <div class="student-info">
        <span id="student-animal" class="animal-icon"></span>
        <div>
          <h1 id="student-name"></h1>
          <p id="student-code" class="code"></p>
        </div>
      </div>
      <div class="header-actions">
        <div class="language-toggle-small">
          <button onclick="setLanguage('es')" class="lang-btn-small">ES</button>
          <button onclick="setLanguage('en')" class="lang-btn-small">EN</button>
        </div>
        <button onclick="logout()" class="btn-logout" data-i18n="student.logout">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="student-main">
    <div id="theme-banner" class="theme-banner"></div>

    <section class="points-section">
      <h2 data-i18n="student.accumulated">Puntos acumulados</h2>
      <div class="points-display">
        <span id="total-points" class="points-number">0</span>
        <span class="points-label" data-i18n="student.myPoints">Mis Puntos</span>
      </div>
    </section>

    <section class="ranking-section">
      <h2 data-i18n="student.ranking">Clasificación</h2>
      <div id="ranking-container" class="ranking-list"></div>
    </section>

    <section class="medals-section">
      <h2 data-i18n="student.myMedals">Mis Medallas</h2>
      <div id="medals-container" class="medals-grid"></div>
    </section>

    <section class="classes-section">
      <h2 data-i18n="student.myClasses">Mis Clases</h2>
      <div id="classes-container" class="classes-list"></div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/student.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initStudentPortal);
  </script>
</body>
</html>
